# JSON parser for the k3s audit log envelope. stageTimestamp as Time_Key so the
# event carries the API server's own timestamp, not Fluent Bit's ingest time.

[PARSER]
    Name         k8s_audit_json
    Format       json
    Time_Key     stageTimestamp
    Time_Format  %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep    On
