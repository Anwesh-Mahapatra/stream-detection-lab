# Ship-only: tail the k3s audit log, parse the outer JSON envelope for correct event
# timestamps, produce raw to Kafka. No field mapping, no filtering, no ECS - that all
# happens in Flink now. This runs on the HOST (systemd/foreground), not in Docker,
# because it needs to read /var/log/k3s-audit/audit.log which lives on the host.

[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Tag               k8s_audit
    Path              /var/log/k3s-audit/audit.log
    Parser            k8s_audit_json
    # Same reasoning as your ES-output config: k3s can write very long lines for
    # bulk operations, and one bad line shouldn't kill the whole input.
    Skip_Long_Lines   On
    DB                /var/lib/fluent-bit/k8s-audit-raw.db

[OUTPUT]
    Name              kafka
    Match             k8s_audit
    # HOST listener, not the container-network BROKER listener - Fluent Bit runs
    # outside Docker. See docker/docker-compose.yml and the README for why Kafka
    # advertises two different addresses for the same broker.
    Brokers           localhost:29092
    Topic             k8s-audit-raw
    Format            json
    # rdkafka.* keys go straight to librdkafka - this one keeps a retrying producer
    # from spamming "connection closed" at info level on every idle disconnect.
    rdkafka.log.connection.close false

# Dropped vs. the Elasticsearch-output version of this config, and why:
#   - Write_Operation create: that was to satisfy ES data streams (append-only,
#     reject anything but "create"). Kafka has no such concept - a topic is just
#     an ordered log, there's no "operation type" per record.
#   - Replace_Dots: that existed because ES field names can't contain literal dots
#     without creating mapping conflicts (a.b vs {"a":{"b":...}}). Kafka doesn't
#     parse the JSON at all, so dotted keys in the raw payload are fine sitting in
#     a message - that problem only resurfaces once Flink or ES look at the field
#     names, which is now downstream of this file, not this file's problem.
