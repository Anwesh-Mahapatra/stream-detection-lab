[SERVICE]
    Flush        5
    Log_Level    info
    HTTP_Server  On
    HTTP_Port    2021

[INPUT]
    Name              kafka
    Tag               k8s_ecs
    Brokers           127.0.0.1:29092
    Topics            k8s-audit-ecs
    Group_Id          fluentbit-es-sink
    # Read the whole topic on first run. Kafka tracks our position after that.
    rdkafka.auto.offset.reset  earliest
    Format            json

[FILTER]
    Name          nest
    Match         k8s_ecs
    Operation     lift
    Nested_under  payload

[FILTER]
    Name       record_modifier
    Match      k8s_ecs
    Remove_key date
    Remove_key topic
    Remove_key error
    Remove_key key

[OUTPUT]
    Name               es
    Match              k8s_ecs
    Host               127.0.0.1
    Port               9200
    Index              k8s-audit
    Buffer_Size        8MB
    Suppress_Type_Name On
    # THE dedupe line: use row_id as the ES document _id. Without this,
    # AT_LEAST_ONCE in Flink produces duplicate documents on replay.
    Generate_ID        Off
    Id_Key             $k8s['audit']['row_id']
    Trace_Error        On
    Replace_Dots       Off