[SERVICE]
    Flush        5
    Log_Level    info
    HTTP_Server  On
    HTTP_Port    2021

[INPUT]
    Name              kafka
    Tag               k8s_ecs
    Brokers           127.0.0.1:29092
    Topics            k8s-audit-ecs
    Group_Id          fluentbit-es-sink
    # Read the whole topic on first run. Kafka tracks our position after that.
    rdkafka.auto.offset.reset  earliest
    Format            json

[FILTER]
    Name          nest
    Match         k8s_ecs
    Operation     lift
    Nested_under  payload

[FILTER]
    Name       record_modifier
    Match      k8s_ecs
    Remove_key date
    Remove_key topic
    Remove_key error
    Remove_key key

[OUTPUT]
    Name               es
    Match              k8s_ecs
    Host               127.0.0.1
    Port               9200
    Index              k8s-audit
    # Elasticsearch security is enabled, so this sink must authenticate or every
    # bulk request comes back 401. Fluent Bit expands ${...} from its own process
    # environment - it does NOT read docker/.env - so export these before launching:
    #   export ES_USER=fluentbit_writer
    #   export ES_PASSWORD=...   # value is in docker/.env
    # fluentbit_writer holds only the k8s_audit_writer role: write to k8s-audit*
    # and nothing else. Do not point this at the elastic superuser.
    HTTP_User          elastic
    HTTP_Passwd        ${ELASTIC_PASSWORD}
    Buffer_Size        8MB
    Suppress_Type_Name On
    # THE dedupe line: use row_id as the ES document _id. Without this,
    # AT_LEAST_ONCE in Flink produces duplicate documents on replay.
    Generate_ID        Off
    Id_Key             $k8s['audit']['row_id']
    Trace_Error        On
    Replace_Dots       Off
