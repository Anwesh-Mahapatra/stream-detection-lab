# kafka (KRaft, single broker), flink jobmanager+taskmanager, elasticsearch, kibana.
# Everything binds to 127.0.0.1 - nothing here is meant to be reachable off this box.

x-flink-common: &flink-common
  build:
    context: ./flink
    args:
      FLINK_IMAGE_TAG: ${FLINK_IMAGE_TAG}
      FLINK_VERSION: ${FLINK_VERSION}
  environment:
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      taskmanager.numberOfTaskSlots: ${FLINK_TM_NUM_SLOTS}
      parallelism.default: 1
      jobmanager.memory.process.size: ${FLINK_JM_PROCESS_SIZE}
      taskmanager.memory.process.size: ${FLINK_TM_PROCESS_SIZE}
      taskmanager.rpc.port: 6122
  volumes:
    # pipeline/ is bind-mounted, not baked into the image, so `make submit` always
    # runs whatever is on disk right now - no rebuild-to-test-a-one-line-change loop.
    - ../pipeline:/opt/sdl/pipeline:ro

services:
  kafka:
    image: apache/kafka:${KAFKA_IMAGE_TAG}
    hostname: kafka
    ports:
      # Only the host listener is published. The broker listener (9092) is
      # container-network-only - see README "Kafka dual listener" section.
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,BROKER://0.0.0.0:9092,HOST://0.0.0.0:29092
      # Two different addresses advertised for the same broker on purpose: containers
      # resolve "kafka" on the compose network, the host cannot.
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:9092,HOST://127.0.0.1:29092
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS}
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Real functional check (asks the broker for its API versions), not just a
      # TCP probe - a broker can accept connections before it's actually ready.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  jobmanager:
    <<: *flink-common
    hostname: jobmanager
    command: jobmanager
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      # No curl in this image - a bare TCP connect to the web UI port is enough to
      # know the process is up and accepting requests.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  taskmanager:
    <<: *flink-common
    hostname: taskmanager
    command: taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6122' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    hostname: elasticsearch
    environment:
      discovery.type: single-node
      # Security ON. Required by anything that calls the _security APIs - notably
      # Kibana's detection engine, which fails with "undefined: undefined (400)" when
      # this is false because /_security/user/_has_privileges has no handler at all.
      # HTTP TLS stays off (plain http on 9200); single-node discovery permits
      # security without transport TLS, so this is auth-without-encryption.
      xpack.security.enabled: "true"
      # Only read while bootstrapping the .security index on first start with security
      # enabled. Changing it later does nothing - use the _security API to rotate.
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      # The '&' in this URL is why the whole query string is single-quoted: unquoted,
      # the shell treats it as "run curl in the background, exit 0 immediately" and
      # the healthcheck passes unconditionally no matter what curl actually returns.
      # -u is required now that security is on: without it this 401s, the container
      # never reports healthy, and kibana's depends_on gate never opens.
      test: ["CMD-SHELL", "curl -s -f -u elastic:${ELASTIC_PASSWORD} 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    hostname: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      # kibana_system is the built-in least-privilege account Kibana is meant to use.
      # Never point this at the elastic superuser. Its password is NOT set by
      # ELASTIC_PASSWORD - it has to be set through the _security API after ES boots
      # (scripts/bootstrap.sh does this).
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
      NODE_OPTIONS: --max-old-space-size=${KIBANA_MAX_OLD_SPACE_MB}
      # Without these, Kibana invents a random key at every boot, and anything built
      # on Encrypted Saved Objects (Alerting, Actions/Connectors) fails with
      # "Unable to create actions client because the Encrypted Saved Objects plugin
      # is missing encryption key". They must stay STABLE across restarts - rotating
      # them orphans every already-encrypted saved object. 32+ chars each.
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ESO_ENCRYPTION_KEY}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_REPORTING_ENCRYPTION_KEY}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_SECURITY_ENCRYPTION_KEY}
    ports:
      # Defaults to 127.0.0.1 like everything else. Override KIBANA_BIND in .env to
      # publish on a LAN address - but read the README "known trade-offs" note first:
      # this stack has no auth, so a LAN bind means unauthenticated Kibana for the
      # whole subnet. Docker's iptables rules bypass ufw, so a ufw rule will NOT
      # restrict this port; use the DOCKER-USER chain if you need source filtering.
      - "${KIBANA_BIND:-127.0.0.1}:5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f 'http://localhost:5601/api/status' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

volumes:
  kafka-data:
  es-data:
