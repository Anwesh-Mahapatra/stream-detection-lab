global:
  scrape_interval: 10s

scrape_configs:
  - job_name: fluentbit-ingest
    metrics_path: /api/v1/metrics/prometheus
    static_configs:
      - targets: ['host.docker.internal:2020']
        labels: {hop: 'audit-to-kafka'}

  - job_name: fluentbit-sink
    metrics_path: /api/v1/metrics/prometheus
    static_configs:
      - targets: ['host.docker.internal:2021']
        labels: {hop: 'kafka-to-es'}
